<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Stackly travel blog - tips, guides, inspiration and stories from around the world.">
    <title>Travel Blog - Stackly Travel & Tourism</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <a href="#main" class="skip-to-content">Skip to main content</a>
    <header class="header" id="header"></header>
    <main id="main">
        <section class="page-hero page-hero-blog">
            <div class="container">
                <h1 class="scroll-animate">Travel Blog</h1>
                <p class="scroll-animate">Stories, tips and inspiration for your next journey</p>
                <nav class="breadcrumbs" aria-label="Breadcrumb">
                    <a href="index.html">Home</a> <span>/</span> <span>Blog</span>
                </nav>
            </div>
        </section>

        <section>
            <div class="container">
                <div class="grid grid-3" id="blogGrid"></div>
            </div>
        </section>
    </main>

    <footer class="footer" id="footer"></footer>
    <button class="scroll-top" aria-label="Scroll to top">↑</button>

    <script src="js/data.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/main.js"></script>
    <script src="js/wishlist.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const grid = document.getElementById('blogGrid');
            if (!grid || !window.STACKLY_DATA) return;
            grid.innerHTML = window.STACKLY_DATA.blog.map(post => `
                <article class="card blog-card scroll-animate fade-up">
                    <div class="card-image">
                        <img src="${post.image}" alt="${post.title}" loading="lazy" width="800" height="500">
                        <span class="card-badge blue">${post.category}</span>
                    </div>
                    <div class="card-content">
                        <div class="post-meta">
                            <span>✍ ${post.author}</span>
                            <span>📅 ${post.date}</span>
                        </div>
                        <h3 class="card-title"><a href="blog-details.html?id=${post.id}">${post.title}</a></h3>
                        <p class="card-description">${post.excerpt}</p>
                        <div class="card-footer">
                            <a href="blog-details.html?id=${post.id}" class="btn btn-outline btn-sm">Read More <span class="arrow">→</span></a>
                        </div>
                    </div>
                </article>`).join('');
            if (typeof window.initScrollAnimations === 'function') window.initScrollAnimations();
        });
    </script>
</body>
</html>
