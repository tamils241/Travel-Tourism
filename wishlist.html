<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Your saved Stackly destinations, tours and hotels wishlist.">
    <title>Wishlist - Stackly Travel & Tourism</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <a href="#main" class="skip-to-content">Skip to main content</a>
    <header class="header" id="header"></header>
    <main id="main">
        <section class="page-hero page-hero-wishlist">
            <div class="container">
                <h1 class="scroll-animate">My Wishlist</h1>
                <p class="scroll-animate">Your saved destinations, tours and hotels</p>
                <nav class="breadcrumbs" aria-label="Breadcrumb">
                    <a href="index.html">Home</a> <span>/</span> <span>Wishlist</span>
                </nav>
            </div>
        </section>

        <section>
            <div class="container">
                <div class="wishlist-actions" id="wishlistActions" hidden>
                    <button class="btn btn-outline btn-sm" id="clearWishlistBtn">Clear Wishlist</button>
                </div>
                <div class="grid grid-3" id="wishlistGrid"></div>
                <div class="empty-state" id="wishlistEmpty" hidden>
                    <div class="empty-state-icon">💔</div>
                    <h3 class="empty-state-title">Your wishlist is empty</h3>
                    <p class="empty-state-description">Start exploring and tap the heart icon to save your favorite destinations, tours and hotels.</p>
                    <a href="destinations.html" class="btn btn-primary">Explore Destinations</a>
                </div>
            </div>
        </section>
    </main>

    <footer class="footer" id="footer"></footer>
    <button class="scroll-top" aria-label="Scroll to top">↑</button>

    <script src="js/layout.js"></script>
    <script src="js/main.js"></script>
    <script src="js/wishlist.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            var grid = document.getElementById('wishlistGrid');
            var empty = document.getElementById('wishlistEmpty');
            var actions = document.getElementById('wishlistActions');

            function detailLink(item) {
                if (item.type === 'tour') return 'tour-details.html?id=' + item.id.replace('tour-', '');
                if (item.type === 'hotel') return 'hotel-details.html?id=' + item.id.replace('hotel-', '');
                return 'destination-details.html?id=' + item.id.replace('dest-', '');
            }

            function render() {
                var items = (typeof window.getWishlistItems === 'function') ? window.getWishlistItems() : [];
                if (!items.length) {
                    grid.innerHTML = '';
                    empty.hidden = false;
                    actions.hidden = true;
                    return;
                }
                empty.hidden = true;
                actions.hidden = false;
                grid.innerHTML = items.map(function (item) {
                    return '<article class="card">' +
                        '<button class="wishlist-btn active" data-id="' + item.id + '" data-title="' + item.title + '" data-type="' + item.type + '" aria-label="Remove from wishlist"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8l1.1 1.1L12 21l7.8-7.5 1.1-1.1a5.5 5.5 0 0 0-.1-7.8z"></path></svg></button>' +
                        '<div class="card-image"><img src="' + (item.image || 'images/library/photo-1476514525535-07fb3b4ae5f1.webp') + '" alt="' + item.title + '" loading="lazy" width="800" height="450"></div>' +
                        '<div class="card-content">' +
                        '<span class="tag">' + (item.type || 'item') + '</span>' +
                        '<h3 class="card-title"><a href="' + detailLink(item) + '">' + item.title + '</a></h3>' +
                        (item.location ? '<p class="card-description"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="vertical-align:-2px"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg> ' + item.location + '</p>' : '') +
                        '<div class="card-footer">' +
                        '<div class="card-price">' + (item.price || '') + '</div>' +
                        '<a href="' + detailLink(item) + '" class="btn btn-outline btn-sm">View</a>' +
                        '</div></div></article>';
                }).join('');
            }

            render();

            // Re-render when an item is removed (wishlist.js toggles)
            grid.addEventListener('click', function (e) {
                if (e.target.closest('.wishlist-btn')) {
                    setTimeout(render, 50);
                }
            });

            var clearBtn = document.getElementById('clearWishlistBtn');
            if (clearBtn) {
                clearBtn.addEventListener('click', function () {
                    if (typeof window.clearWishlist === 'function') {
                        window.clearWishlist();
                    }
                    render();
                });
            }
        });
    </script>
</body>
</html>
